name: Public gateway integrity checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# New push cancels the older run of the same branch or pull request (saves Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gateway onboarding security tests
        run: python -m unittest discover -s tests -v
      - name: Validate AI contribution manifest without external dependencies
        run: python -m json.tool AI_CONTRIBUTE.json > /dev/null
