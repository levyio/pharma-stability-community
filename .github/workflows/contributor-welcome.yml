name: Static AI contributor welcome

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  # GitHub re-runs or duplicate deliveries must not race to create duplicate welcomes.
  group: ai-join-welcome-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  welcome:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[JOIN] ')
    runs-on: ubuntu-latest
    # Static welcome only. Public issue bodies are never executed or interpolated.

    timeout-minutes: 5
    steps:
      - name: Trusted main-branch static welcome script only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Post a role-neutral, non-AI welcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.welcome
# No fork/head checkout, no untrusted issue-body substitution, no model API calls.
